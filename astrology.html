<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Alyssa's Guide to Witchcraft — Astrology</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
  .chart-card { display:flex; justify-content:space-around; text-align:center; }
  .chart-item .glyph { font-size:1.8rem; color: var(--pine); display:block; }
  .chart-item .label { font-size:0.7rem; color: var(--ink-soft); }
  .chart-item .value { font-family: var(--font-display); font-weight:600; color: var(--pine); }


  /* Zodiac wheel */
  .zodiac-wrap { display:flex; justify-content:center; margin: 2px 0 8px; }
  #zodiacWheel { width:100%; max-width:340px; height:auto; }
  .zwedge { cursor:pointer; stroke: var(--ivory); stroke-width:1.5; }
  .zwedge.today { stroke: var(--gold); stroke-width:2.5; filter: drop-shadow(0 0 4px rgba(184,145,47,0.6)); }
  .zglyph { font-family: var(--font-display); font-size:17px; fill: var(--pine-deep); text-anchor:middle; pointer-events:none; }
  .zdates { font-family: var(--font-body); font-size:6.4px; fill: var(--ink); text-anchor:middle; pointer-events:none; }
  .zcenter { font-family: var(--font-display); fill: var(--pine); text-anchor:middle; }
  .zpointer { fill: var(--gold); }
  .element-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; margin-top:6px; }
  .element-legend span { font-size:0.75rem; color: var(--ink-soft); display:inline-flex; align-items:center; gap:5px; }
  .element-legend i { width:12px; height:12px; border-radius:3px; border:1px solid var(--ink-soft); display:inline-block; }

  .sign-detail { display:none; margin-top:10px; }
  .sign-detail.open { display:block; }

  .planet-row, .house-row { padding: 10px 0; border-bottom: 1px solid var(--ivory-dim); }
  .planet-row:last-child, .house-row:last-child { border-bottom: none; }
  .planet-row .title, .house-row .title { font-family: var(--font-display); font-weight:600; color: var(--pine); font-size: 1.05rem; }

  .aspect-row { display:flex; gap:12px; padding: 10px 0; border-bottom: 1px solid var(--ivory-dim); align-items:flex-start; }
  .aspect-row:last-child { border-bottom:none; }
  .aspect-symbol { font-size:1.4rem; color: var(--gold); width: 30px; text-align:center; flex-shrink:0; }
  .aspect-row .title { font-family: var(--font-display); font-weight:600; color:var(--pine); }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-content">

    <div class="card chart-card">
      <div class="chart-item"><span class="glyph">☉</span><span class="value">Libra</span><span class="label">Sun</span></div>
      <div class="chart-item"><span class="glyph">☽</span><span class="value">Cancer</span><span class="label">Moon</span></div>
      <div class="chart-item"><span class="glyph">ASC</span><span class="value">Scorpio</span><span class="label">Rising</span></div>
    </div>

    <div class="card center">
      <div class="zodiac-wrap"><svg id="zodiacWheel" viewBox="0 0 300 300" role="img" aria-label="Wheel of the zodiac signs"></svg></div>
      <div class="element-legend" id="elementLegend"></div>
      <p class="small muted" style="margin:8px 0 0;">Tap a sign to see its details</p>
    </div>

    <div class="divider"></div>

    <div class="accordion-item" id="acc-signs">
      <div class="accordion-header">The 12 Signs <span class="chevron">▾</span></div>
      <div class="accordion-body">
        <div class="symbol-grid" id="signGrid"></div>
        <div class="sign-detail" id="signDetail"></div>
      </div>
    </div>

    <div class="accordion-item" id="acc-planets">
      <div class="accordion-header">Planets <span class="chevron">▾</span></div>
      <div class="accordion-body" id="planetsBody"></div>
    </div>

    <div class="accordion-item" id="acc-houses">
      <div class="accordion-header">Houses <span class="chevron">▾</span></div>
      <div class="accordion-body" id="housesBody"></div>
    </div>

    <div class="accordion-item" id="acc-aspects">
      <div class="accordion-header">Aspects <span class="chevron">▾</span></div>
      <div class="accordion-body" id="aspectsBody"></div>
    </div>

  </div>
</div>

<script src="shared/astro-core.js"></script>
<script src="shared/astrology-data.js"></script>
<script src="shared/nav.js"></script>
<script>
initNav({ page: 'astrology', title: 'Astrology', eyebrow: "Alyssa's Guide to Witchcraft" });

document.querySelectorAll('.accordion-header').forEach(h => {
  h.addEventListener('click', () => {
    const item = h.parentElement;
    const wasOpen = item.classList.contains('open');
    item.classList.toggle('open', !wasOpen);
    const body = item.querySelector('.accordion-body');
    body.style.maxHeight = !wasOpen ? body.scrollHeight + 40 + 'px' : 0;
  });
});

// Signs grid + detail
const signGrid = document.getElementById('signGrid');
const signTiles = [];

function selectSign(i, fromWheel) {
  const s = AstrologyData.SIGNS[i];
  signTiles.forEach(t => t.classList.remove('selected'));
  signTiles[i].classList.add('selected');
  const detail = document.getElementById('signDetail');
  detail.innerHTML = `
    <h3>${s.symbol} ${s.name}</h3>
    <p class="small muted">${s.dates}</p>
    <div class="info-row" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
      <span class="pill">${s.element}</span>
      <span class="pill teal">${s.modality}</span>
      <span class="pill gold">Ruled by ${s.ruler}</span>
    </div>
    <p class="small">${s.keywords.join(' · ')}</p>
  `;
  detail.classList.add('open');
  const acc = document.getElementById('acc-signs');
  const body = acc.querySelector('.accordion-body');
  acc.classList.add('open');
  body.style.maxHeight = body.scrollHeight + 60 + 'px';
  if (fromWheel) setTimeout(() => detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 350);
}

AstrologyData.SIGNS.forEach((s, i) => {
  const tile = document.createElement('div');
  tile.className = 'symbol-tile';
  tile.innerHTML = `<span class="glyph">${s.symbol}</span><span class="label">${s.name}</span>`;
  tile.addEventListener('click', () => selectSign(i, false));
  signTiles.push(tile);
  signGrid.appendChild(tile);
});

// Zodiac wheel (turns with the Sun's real ecliptic longitude)
const ZNS = "http://www.w3.org/2000/svg";
const ZCX = 150, ZCY = 150, Z_OUTER = 136, Z_INNER = 50, Z_GLYPH = 118, Z_DATES = 88;
const ELEMENT_COLORS = { Fire: '#E6B877', Earth: '#A9B48C', Air: '#EFE8D2', Water: '#7FAEA9' };

function zpt(r, deg) {
  const rad = deg * Math.PI / 180;
  return [ZCX + r * Math.sin(rad), ZCY - r * Math.cos(rad)];
}
function zannulus(r1, r2, a0, a1) {
  const [x0, y0] = zpt(r2, a0), [x1, y1] = zpt(r2, a1);
  const [x2, y2] = zpt(r1, a1), [x3, y3] = zpt(r1, a0);
  return `M${x0},${y0} A${r2},${r2} 0 0 1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 0 0 ${x3},${y3} Z`;
}
function zel(tag, attrs, text) {
  const e = document.createElementNS(ZNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}

let zodiacDay = null;
function buildZodiacWheel() {
  const now = new Date();
  zodiacDay = now.toDateString();
  const sunLon = AstroCore.sunPosition(AstroCore.daysSince2000(now)).lon;
  const todayIdx = Math.floor(sunLon / 30) % 12;
  const svg = document.getElementById('zodiacWheel');
  svg.innerHTML = '';

  const order = AstrologyData.SIGNS.map((_, i) => i).sort((a, b) => (a === todayIdx) - (b === todayIdx));
  order.forEach(i => {
    const s = AstrologyData.SIGNS[i];
    const a0 = i * 30 - sunLon;
    const path = zel('path', {
      d: zannulus(Z_INNER, Z_OUTER, a0, a0 + 30),
      class: 'zwedge' + (i === todayIdx ? ' today' : ''),
      fill: ELEMENT_COLORS[s.element]
    });
    path.addEventListener('click', () => selectSign(i, true));
    svg.appendChild(path);
  });

  AstrologyData.SIGNS.forEach((s, i) => {
    const mid = i * 30 - sunLon + 15;
    const [gx, gy] = zpt(Z_GLYPH, mid);
    svg.appendChild(zel('text', { x: gx, y: gy, class: 'zglyph', 'dominant-baseline': 'middle' }, s.symbol + '\uFE0E'));
    const [d0, d1] = s.dates.split(/\s*[–-]\s*/);
    const [dx, dy] = zpt(Z_DATES, mid);
    const t = zel('text', { x: dx, y: dy, class: 'zdates' });
    t.appendChild(zel('tspan', { x: dx, dy: '-0.3em' }, d0 + ' –'));
    t.appendChild(zel('tspan', { x: dx, dy: '1.2em' }, d1));
    svg.appendChild(t);
  });

  svg.appendChild(zel('circle', { cx: ZCX, cy: ZCY, r: Z_INNER - 3, fill: 'var(--ivory)', stroke: 'var(--pine)', 'stroke-width': 1.5 }));
  svg.appendChild(zel('text', { x: ZCX, y: ZCY - 5, class: 'zcenter', 'font-size': 15 },
    now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })));
  svg.appendChild(zel('text', { x: ZCX, y: ZCY + 12, class: 'zcenter', 'font-size': 8.5, 'font-family': 'var(--font-body)', fill: 'var(--ink-soft)' },
    'Sun in ' + AstrologyData.SIGNS[todayIdx].name));

  const a = zpt(Z_OUTER + 2, 0), b = zpt(Z_OUTER + 12, -5), c = zpt(Z_OUTER + 12, 5);
  svg.appendChild(zel('polygon', { points: `${a[0]},${a[1]} ${b[0]},${b[1]} ${c[0]},${c[1]}`, class: 'zpointer' }));
}

document.getElementById('elementLegend').innerHTML = Object.keys(ELEMENT_COLORS)
  .map(el => `<span><i style="background:${ELEMENT_COLORS[el]}"></i>${el}</span>`).join('');
buildZodiacWheel();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && zodiacDay !== new Date().toDateString()) buildZodiacWheel();
});

// Planets
document.getElementById('planetsBody').innerHTML = AstrologyData.PLANETS.map(p => `
  <div class="planet-row">
    <div class="title">${p.symbol} ${p.name}</div>
    <p class="small" style="margin:4px 0 2px;">${p.domain}</p>
    <p class="small muted" style="margin:0;">Rules ${p.rules}</p>
  </div>
`).join('');

// Houses
const ORDINALS = ["1st","2nd","3rd","4th","5th","6th","7th","8th","9th","10th","11th","12th"];
document.getElementById('housesBody').innerHTML = AstrologyData.HOUSES.map(h => `
  <div class="house-row">
    <div class="title">${ORDINALS[h.num-1]} House — ${h.name}</div>
    <p class="small" style="margin:4px 0 0;">${h.meaning}</p>
  </div>
`).join('');

// Aspects
document.getElementById('aspectsBody').innerHTML = AstrologyData.ASPECTS.map(a => `
  <div class="aspect-row">
    <div class="aspect-symbol">${a.symbol}</div>
    <div>
      <div class="title">${a.name} <span class="muted small">(${a.angle}, orb ${a.orb})</span></div>
      <p class="small" style="margin:4px 0 0;">${a.meaning}</p>
    </div>
  </div>
`).join('');
</script>
</body>
</html>
