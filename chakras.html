<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Alyssa's Guide to Witchcraft — Chakras</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;700&display=swap');

  .body-wrap { display:flex; justify-content:center; margin: 6px 0 18px; }
  #bodySvg { width: 100%; max-width: 260px; height: auto; }
  .chakra-point { cursor: pointer; }
  .chakra-point .point-backing { fill: var(--ivory); stroke: var(--moss-soft); stroke-width: 1.5; }
  .chakra-point.selected .point-backing { stroke: var(--rose-deep); stroke-width: 3; }
  .chakra-label { font-family: var(--font-body); font-size: 12px; fill: var(--ink); pointer-events: none; }
  .chakra-label.selected { font-weight: 600; fill: var(--pine); }
  .devanagari { font-family: 'Noto Sans Devanagari', 'FreeSans', sans-serif; }

  .chakra-detail .detail-head { display:flex; align-items:center; gap:12px; margin-bottom: 8px; }
  .chakra-detail .detail-glyph { flex-shrink: 0; }
  .chakra-detail h2 { margin-bottom: 0; }
  .chakra-detail .sanskrit { font-style: italic; color: var(--ink-soft); }
  .chakra-detail .pills { margin: 8px 0; }
  .chakra-detail .meta-line { margin: 0 0 10px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-content">

    <p class="muted center small">Tap a point on the body for that chakra's lotus, yantra, and correspondences.</p>

    <div class="body-wrap">
      <svg id="bodySvg" viewBox="0 0 270 340">
        <!-- Body silhouette, seated in lotus pose -->
        <circle cx="110" cy="58" r="34" fill="var(--moss-soft)" stroke="var(--pine)" stroke-width="1.5"/>
        <rect x="101" y="90" width="18" height="14" rx="7" fill="var(--moss-soft)"/>
        <path d="M75,104 C75,99 145,99 145,104 C155,140 170,190 176,235 C180,258 182,275 168,286 C148,298 128,294 110,294 C92,294 72,298 52,286 C38,275 40,258 44,235 C50,190 65,140 75,104 Z"
              fill="var(--moss-soft)" stroke="var(--pine)" stroke-width="1.5"/>
        <ellipse cx="110" cy="290" rx="20" ry="9" fill="var(--moss-soft)" stroke="var(--pine)" stroke-width="1.5"/>

        <!-- Chakra point slots (filled by JS) -->
        <g class="chakra-point" data-id="crown" transform="translate(110,20)"></g>
        <g class="chakra-point" data-id="thirdEye" transform="translate(110,60)"></g>
        <g class="chakra-point" data-id="throat" transform="translate(110,100)"></g>
        <g class="chakra-point" data-id="heart" transform="translate(110,140)"></g>
        <g class="chakra-point" data-id="solar" transform="translate(110,180)"></g>
        <g class="chakra-point" data-id="sacral" transform="translate(110,220)"></g>
        <g class="chakra-point" data-id="root" transform="translate(110,260)"></g>

        <!-- Labels -->
        <text class="chakra-label" id="label-crown" x="136" y="24">Crown</text>
        <text class="chakra-label" id="label-thirdEye" x="156" y="64">Third Eye</text>
        <text class="chakra-label" id="label-throat" x="155" y="104">Throat</text>
        <text class="chakra-label" id="label-heart" x="178" y="144">Heart</text>
        <text class="chakra-label" id="label-solar" x="182" y="184">Solar Plexus</text>
        <text class="chakra-label" id="label-sacral" x="185" y="224">Sacral</text>
        <text class="chakra-label" id="label-root" x="185" y="264">Root</text>
      </svg>
    </div>

    <div class="card rose-accent chakra-detail" id="chakraDetail">
      <div class="detail-head">
        <span class="detail-glyph" id="detailGlyph"></span>
        <div>
          <h2 id="detailName"></h2>
          <span class="sanskrit small" id="detailSanskrit"></span>
        </div>
      </div>
      <div class="pills" id="detailPills"></div>
      <p class="muted small meta-line" id="detailMeta"></p>
      <p id="detailText" style="margin:0;"></p>
    </div>

  </div>
</div>

<script src="shared/chakras-data.js"></script>
<script src="shared/nav.js"></script>
<script>
initNav({ page: 'chakras', title: "Chakras", eyebrow: "Alyssa's Guide to Witchcraft" });

const NS = "http://www.w3.org/2000/svg";

function petalPath(r0, r1, hw) {
  const mid = -(r0 + r1) / 2;
  return `M0,${-r0} Q${hw},${mid} 0,${-r1} Q${-hw},${mid} 0,${-r0} Z`;
}

function lotusRing(petals, r0, r1, color, angleOffset) {
  angleOffset = angleOffset || 0;
  const hw = Math.min(14, Math.max(2.5, (Math.PI * ((r0 + r1) / 2) / petals) * 0.5));
  let s = '';
  for (let i = 0; i < petals; i++) {
    const ang = angleOffset + i * (360 / petals);
    s += `<path d="${petalPath(r0, r1, hw)}" transform="rotate(${ang})" fill="${color}" stroke="var(--ivory)" stroke-width="1"/>`;
  }
  return s;
}

function chandraBindu(color) {
  return `<path d="M-7,0.8 Q0,-6 7,0.8 Q0,-1.8 -7,0.8 Z" fill="${color}" stroke="var(--ivory)" stroke-width="0.9"/>
          <circle cx="0" cy="-7.8" r="2.3" fill="${color}" stroke="var(--ivory)" stroke-width="0.9"/>`;
}

function yantraMarkup(c) {
  const color = c.color;
  const a = 14;
  const letterFontSize = 15;
  let outline = '';
  let letterEl = `<text class="devanagari" x="0" y="5.5" text-anchor="middle" font-size="${letterFontSize}" font-weight="600" fill="${color}">${c.devanagari}</text>`;
  let binduY = -a - 5;

  switch (c.yantra) {
    case 'square-triangle': // Root
      outline = `<rect x="${-a}" y="${-a}" width="${2*a}" height="${2*a}" fill="none" stroke="${color}" stroke-width="1.6"/>
                  <polygon points="0,${a*0.85} ${-a*0.8},${-a*0.65} ${a*0.8},${-a*0.65}" fill="none" stroke="${color}" stroke-width="1.3"/>`;
      break;
    case 'crescent-outline': // Sacral
      outline = `<path d="M0,${-a} A${a},${a} 0 1,0 0,${a} A${a*0.6},${a} 0 1,1 0,${-a} Z" fill="none" stroke="${color}" stroke-width="1.6"/>`;
      break;
    case 'triangle-down': // Solar Plexus
      outline = `<polygon points="0,${a} ${-a},${-a*0.75} ${a},${-a*0.75}" fill="none" stroke="${color}" stroke-width="1.6"/>`;
      binduY = -a * 0.75 - 5;
      break;
    case 'hexagram': // Heart
      outline = `<polygon points="0,${-a} ${-a*0.87},${a*0.5} ${a*0.87},${a*0.5}" fill="none" stroke="${color}" stroke-width="1.5"/>
                  <polygon points="0,${a} ${-a*0.87},${-a*0.5} ${a*0.87},${-a*0.5}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
      break;
    case 'circle-triangle': // Throat
      outline = `<circle r="${a}" fill="none" stroke="${color}" stroke-width="1.6"/>
                  <polygon points="0,${a*0.68} ${-a*0.6},${-a*0.48} ${a*0.6},${-a*0.48}" fill="none" stroke="${color}" stroke-width="1.2"/>`;
      break;
    case 'om-wings': // Third Eye
      outline = `<polygon points="0,${a*0.75} ${-a*0.85},${-a*0.6} ${a*0.85},${-a*0.6}" fill="none" stroke="${color}" stroke-width="1.4"/>`;
      letterEl = `<text class="devanagari" x="0" y="4.5" text-anchor="middle" font-size="13" font-weight="600" fill="${color}">${c.devanagari}</text>`;
      binduY = -a * 0.6 - 5;
      break;
    case 'om': // Crown — just the OM, no outline/bindu
      return `<text class="devanagari" x="0" y="6.5" text-anchor="middle" font-size="19" font-weight="600" fill="${color}">${c.devanagari}</text>`;
  }

  return outline + letterEl + `<g transform="translate(0,${binduY})">${chandraBindu(color)}</g>`;
}

function chakraGlyphMarkup(c) {
  let petalsMarkup;
  if (c.id === 'crown') {
    petalsMarkup = lotusRing(8, 27, 47, c.color) + lotusRing(16, 13, 27, c.color);
  } else if (c.id === 'thirdEye') {
    petalsMarkup = lotusRing(2, 18, 46, c.color, 90);
  } else {
    petalsMarkup = lotusRing(c.petals, 18, 46, c.color);
  }
  return petalsMarkup + yantraMarkup(c);
}

// Build the small on-body markers
const MARKER_R = 17;
const MARKER_SCALE = 0.34;
ChakrasData.CHAKRAS.forEach((c) => {
  const slot = document.querySelector(`.chakra-point[data-id="${c.id}"]`);
  const backing = document.createElementNS(NS, 'circle');
  backing.setAttribute('class', 'point-backing');
  backing.setAttribute('r', MARKER_R);
  slot.appendChild(backing);

  const g = document.createElementNS(NS, 'g');
  g.setAttribute('transform', `scale(${MARKER_SCALE})`);
  g.innerHTML = chakraGlyphMarkup(c);
  slot.appendChild(g);

  slot.addEventListener('click', () => showChakra(c.id));
});

function showChakra(id) {
  const c = ChakrasData.CHAKRAS.find(x => x.id === id);
  if (!c) return;

  document.querySelectorAll('.chakra-point').forEach(p => p.classList.remove('selected'));
  document.querySelectorAll('.chakra-label').forEach(l => l.classList.remove('selected'));
  document.querySelector(`.chakra-point[data-id="${id}"]`).classList.add('selected');
  document.getElementById(`label-${id}`).classList.add('selected');

  document.getElementById('detailGlyph').innerHTML =
    `<svg viewBox="-55 -55 110 110" width="64" height="64">${chakraGlyphMarkup(c)}</svg>`;
  document.getElementById('detailName').textContent = c.name;
  document.getElementById('detailSanskrit').textContent = c.sanskrit;

  const pills = [`<span class="pill teal">${c.element}</span>`];
  pills.push(c.seed ? `<span class="pill gold">Seed sound: ${c.seed}</span>` : `<span class="pill gold">Beyond sound</span>`);
  document.getElementById('detailPills').innerHTML = pills.join('');

  document.getElementById('detailMeta').textContent =
    `${c.petalsDisplay || c.petals + ' petals'} · ${c.location}`;
  document.getElementById('detailText').textContent = c.text;
}

showChakra('root');
</script>
</body>
</html>
