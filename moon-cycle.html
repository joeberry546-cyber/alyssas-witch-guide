<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Alyssa's Guide to Witchcraft — Moon Cycles</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
  .phase-hero { display:flex; align-items:center; gap:16px; }
  .phase-hero svg { width: 88px; height: 88px; flex-shrink:0; }
  .phase-hero-text h2 { margin-bottom: 2px; }
  .info-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .cal-header button { background:none; border:1px solid var(--moss); border-radius:8px; width:34px; height:34px; color:var(--pine); font-size:1.1rem; cursor:pointer; }
  .cal-title { font-family: var(--font-display); font-size:1.15rem; color:var(--pine); font-weight:600; }
  .jump-row { display:flex; justify-content:center; margin-bottom:10px; }
  .jump-row input { max-width: 160px; }

  .cal-grid { display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; }
  .cal-dow { text-align:center; font-size:0.68rem; color: var(--ink-soft); font-family: var(--font-body); padding-bottom:2px; }
  .cal-day { aspect-ratio: 1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; border: 1px solid transparent; }
  .cal-day.empty { visibility:hidden; }
  .cal-day svg { width: 62%; height: 62%; }
  .cal-day .num { font-size: 0.62rem; color: var(--ink-soft); }
  .cal-day.today { border-color: var(--rose-deep); }
  .cal-day.selected { background: var(--ivory-dim); border-color: var(--gold); }

  .day-detail { display:none; margin-top: 12px; }
  .day-detail.open { display:block; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-content">

    <div class="card">
      <div class="phase-hero">
        <svg id="heroIcon" viewBox="-45 -45 90 90"></svg>
        <div class="phase-hero-text">
          <h2 id="heroPhaseName">—</h2>
          <p class="muted small" id="heroIllum"></p>
          <div class="info-row">
            <span class="pill teal" id="heroSign">Moon in —</span>
            <span class="pill" id="heroVoc">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card teal-accent">
      <p class="small" style="margin:0;" id="nextFullLabel">Next Full Moon: —</p>
      <p class="small" style="margin:6px 0 0;" id="nextNewLabel">Next New Moon: —</p>
    </div>

    <div class="divider"></div>

    <div class="jump-row">
      <input type="month" id="monthJump">
    </div>
    <div class="cal-header">
      <button id="prevMonth">‹</button>
      <div class="cal-title" id="calTitle">—</div>
      <button id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>

    <div class="card rose-accent day-detail" id="dayDetail">
      <h3 id="dayDetailDate">—</h3>
      <p class="small" id="dayDetailPhase" style="margin-bottom:4px;"></p>
      <p class="small" id="dayDetailSign" style="margin-bottom:4px;"></p>
      <p class="small" id="dayDetailVoc" style="margin-bottom:0;"></p>
    </div>

  </div>
</div>

<script src="shared/astro-core.js"></script>
<script src="shared/moon-data.js"></script>
<script src="shared/nav.js"></script>
<script>
initNav({ page: 'moon', title: 'Moon Cycles', eyebrow: "Alyssa's Guide to Witchcraft" });

const DOW = ['S','M','T','W','T','F','S'];
let viewYear, viewMonth; // 0-indexed month for the calendar currently displayed
let selectedDayKey = null;

function fmtDate(d) { return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
function fmtTime(d) { return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' }); }
function pct(x) { return Math.round(x*100) + '%'; }

function renderHero() {
  const now = new Date();
  const phase = AstroCore.getMoonPhase(now);
  document.getElementById('heroIcon').innerHTML = MoonData.moonIconMarkup(phase.name, 40);
  document.getElementById('heroPhaseName').textContent = phase.name;
  document.getElementById('heroIllum').textContent = pct(phase.illumination) + ' illuminated';

  const moonLon = AstroCore.moonPosition(AstroCore.daysSince2000(now)).lon;
  document.getElementById('heroSign').textContent = 'Moon in ' + AstroCore.signFromLongitude(moonLon);

  const voc = AstroCore.getVoidOfCourse(now);
  const vocEl = document.getElementById('heroVoc');
  if (voc && voc.isVoidNow) {
    vocEl.textContent = 'Void of course until ' + fmtTime(voc.voidEnd);
    vocEl.className = 'pill rose';
  } else if (voc) {
    vocEl.textContent = 'Void begins ' + fmtTime(voc.voidStart);
    vocEl.className = 'pill';
  }

  const nextFull = AstroCore.findNextPhase(now, 180);
  const nextNew = AstroCore.findNextPhase(now, 0);
  document.getElementById('nextFullLabel').textContent =
    `Next Full Moon: ${fmtDate(nextFull)} — ${MoonData.seasonalNameFor(nextFull)}`;
  document.getElementById('nextNewLabel').textContent = `Next New Moon: ${fmtDate(nextNew)}`;
}

function dayKey(y,m,d){ return `${y}-${m}-${d}`; }

function buildCalendar() {
  const first = new Date(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const startWeekday = first.getDay();
  const today = new Date();

  document.getElementById('calTitle').textContent =
    first.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  document.getElementById('monthJump').value = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  DOW.forEach(l => {
    const el = document.createElement('div');
    el.className = 'cal-dow'; el.textContent = l;
    grid.appendChild(el);
  });
  for (let i=0;i<startWeekday;i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  // track full moons this month for blue-moon labeling
  let fullMoonCountThisMonth = 0;

  for (let d=1; d<=daysInMonth; d++) {
    const dateAtNoon = new Date(viewYear, viewMonth, d, 12, 0, 0);
    const phase = AstroCore.getMoonPhase(dateAtNoon);
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    const key = dayKey(viewYear, viewMonth, d);
    if (today.getFullYear()===viewYear && today.getMonth()===viewMonth && today.getDate()===d) cell.classList.add('today');
    if (key === selectedDayKey) cell.classList.add('selected');

    const iconWrap = document.createElement('div');
    iconWrap.innerHTML = `<svg viewBox="-22 -22 44 44">${MoonData.moonIconMarkup(phase.name, 20)}</svg>`;
    cell.appendChild(iconWrap.firstChild);

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = d;
    cell.appendChild(num);

    cell.addEventListener('click', () => {
      selectedDayKey = key;
      buildCalendar();
      showDayDetail(dateAtNoon);
    });
    grid.appendChild(cell);
  }
}

function showDayDetail(dateAtNoon) {
  const phase = AstroCore.getMoonPhase(dateAtNoon);
  const moonLon = AstroCore.moonPosition(AstroCore.daysSince2000(dateAtNoon)).lon;
  const sign = AstroCore.signFromLongitude(moonLon);
  const voc = AstroCore.getVoidOfCourse(dateAtNoon);

  document.getElementById('dayDetailDate').textContent = fmtDate(dateAtNoon);
  let phaseLine = `${phase.name} · ${pct(phase.illumination)} illuminated`;
  if (phase.name === 'Full Moon') phaseLine += ` · ${MoonData.seasonalNameFor(dateAtNoon)}`;
  document.getElementById('dayDetailPhase').textContent = phaseLine;
  document.getElementById('dayDetailSign').textContent = `Moon in ${sign}`;
  if (voc) {
    document.getElementById('dayDetailVoc').textContent =
      `Void of course: ${fmtTime(voc.voidStart)} – ${fmtTime(voc.voidEnd)} (${voc.sign})`;
  } else {
    document.getElementById('dayDetailVoc').textContent = '';
  }
  document.getElementById('dayDetail').classList.add('open');
  document.getElementById('dayDetail').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth--; if (viewMonth<0){viewMonth=11; viewYear--;}
  buildCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth++; if (viewMonth>11){viewMonth=0; viewYear++;}
  buildCalendar();
});
document.getElementById('monthJump').addEventListener('change', (e) => {
  const [y,m] = e.target.value.split('-').map(Number);
  viewYear = y; viewMonth = m-1;
  buildCalendar();
});

const initNow = new Date();
viewYear = initNow.getFullYear();
viewMonth = initNow.getMonth();
selectedDayKey = dayKey(viewYear, viewMonth, initNow.getDate());

renderHero();
buildCalendar();
showDayDetail(new Date(viewYear, viewMonth, initNow.getDate(), 12, 0, 0));
</script>
</body>
</html>
