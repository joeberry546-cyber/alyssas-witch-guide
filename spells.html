<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alyssa's Guide to Witchcraft — Spells</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="shared/styles.css">
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}


  .lede{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;text-align:center;color:var(--moss);margin:4px 0 22px}

  .acc{border:1px solid var(--ivory-dim);background:#fbf7ec;border-radius:14px;margin-bottom:14px;overflow:hidden}
  .acc>button{all:unset;box-sizing:border-box;display:block;width:100%;padding:16px 18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .acc>button:focus-visible{outline:2px solid var(--gold);outline-offset:-4px;border-radius:12px}
  .acc-top{display:flex;align-items:center;justify-content:space-between}
  .acc-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.45rem;color:var(--pine);letter-spacing:.02em}
  .chev{width:10px;height:10px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);transition:transform .25s;margin-right:4px}
  .acc.open .chev{transform:rotate(-135deg)}
  .acc-body{display:none;padding:2px 18px 24px}
  .acc.open .acc-body{display:block}

  .tag{text-align:center;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--moss);margin:6px 0 4px}
  .rule{height:1px;background:var(--gold);opacity:.55;margin:12px 0}
  .verse{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;color:var(--pine-deep);text-align:center;font-size:1.45rem;line-height:1.35;margin:0}
  .verse span{display:block;padding:7px 0}

  @media (prefers-reduced-motion:reduce){.chev{transition:none}}
</style>
</head>
<body>

<div class="app-shell">
<main class="app-content">
  <p class="lede">Words I’ve written to work with</p>

  <!-- Add future spells as additional .acc sections below -->
  <section class="acc open" id="acc-protection">
    <button type="button" aria-expanded="true" aria-controls="body-protection">
      <span class="acc-top"><span class="acc-title">Standing Protection</span><span class="chev"></span></span>
    </button>
    <div class="acc-body" id="body-protection">
      <div class="tag">daily spell</div>
      <div class="rule"></div>
      <p class="verse">
        <span>armor around us, armor within</span>
        <span>always protected through thick and through thin</span>
        <span>anchored in wisdom protected by grace</span>
        <span>only love and wisdom shall enter my space</span>
      </p>
      <div class="rule"></div>
    </div>
  </section>
</main>
</div>

<script src="shared/nav.js"></script>
<script>
initNav({ page: 'spells', title: 'Spells', eyebrow: 'By This Light' });
(function(){
  document.querySelectorAll('.acc > button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var sec = btn.parentElement;
      var open = sec.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
})();
</script>
</body>
</html>
