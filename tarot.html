<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Alyssa's Guide to Witchcraft — Tarot</title>
<link rel="stylesheet" href="shared/styles.css">
<style>
  .major-row { display:flex; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--ivory-dim); }
  .major-row:last-child { border-bottom:none; }
  .major-num { font-family: var(--font-display); color: var(--gold); font-weight:600; width: 34px; flex-shrink:0; }
  .major-name { font-family: var(--font-display); font-weight:600; color:var(--pine); }
  .major-keywords { font-size:0.82rem; color:var(--ink-soft); margin-top:2px; }

  .minor-row { padding:10px 0; border-bottom:1px solid var(--ivory-dim); }
  .minor-row:last-child { border-bottom:none; }
  .minor-row .title { font-family: var(--font-display); font-weight:600; color:var(--pine); }
  .minor-panel { display:none; }
  .minor-panel.active { display:block; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="app-content">

    <div class="accordion-item open" id="acc-majors">
      <div class="accordion-header">Major Arcana <span class="chevron">▾</span></div>
      <div class="accordion-body" id="majorsBody"></div>
    </div>

    <div class="divider"></div>

    <h2>Minor Arcana</h2>
    <p class="muted small">Combine a suit's theme with a number or court phrase to read any of the 56 minor cards — for example, the Three of Cups is Cups' theme joined with the Three's phrase.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="numbers">Numbers</button>
      <button class="tab-btn" data-tab="suits">Suits</button>
      <button class="tab-btn" data-tab="courts">Courts</button>
    </div>

    <div class="card">
      <div class="minor-panel active" id="panel-numbers"></div>
      <div class="minor-panel" id="panel-suits"></div>
      <div class="minor-panel" id="panel-courts"></div>
    </div>

  </div>
</div>

<script src="shared/tarot-data.js"></script>
<script src="shared/nav.js"></script>
<script>
initNav({ page: 'tarot', title: 'Tarot', eyebrow: "Alyssa's Guide to Witchcraft" });

document.querySelectorAll('#acc-majors .accordion-header').forEach(h => {
  h.addEventListener('click', () => {
    const item = h.parentElement;
    const wasOpen = item.classList.contains('open');
    item.classList.toggle('open', !wasOpen);
    const body = item.querySelector('.accordion-body');
    body.style.maxHeight = !wasOpen ? body.scrollHeight + 40 + 'px' : 0;
  });
});

document.getElementById('majorsBody').innerHTML = TarotData.MAJORS.map(m => `
  <div class="major-row">
    <div class="major-num">${m.num}</div>
    <div>
      <div class="major-name">${m.name}</div>
      <div class="major-keywords">${m.keywords.join(' · ')}</div>
    </div>
  </div>
`).join('');

// initialize the max-height for the majors panel, which starts open
{
  const majorsBody = document.getElementById('majorsBody');
  majorsBody.style.maxHeight = majorsBody.scrollHeight + 40 + 'px';
}

document.getElementById('panel-numbers').innerHTML = TarotData.NUMBERS.map(n => `
  <div class="minor-row"><div class="title">${n.n}</div><p class="small" style="margin:2px 0 0;">${n.text}</p></div>
`).join('');
document.getElementById('panel-suits').innerHTML = TarotData.SUITS.map(s => `
  <div class="minor-row"><div class="title">${s.name}</div><p class="small" style="margin:2px 0 0;">${s.keywords}</p></div>
`).join('');
document.getElementById('panel-courts').innerHTML = TarotData.COURTS.map(c => `
  <div class="minor-row"><div class="title">${c.n}</div><p class="small" style="margin:2px 0 0;">${c.text}</p></div>
`).join('');

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.minor-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
